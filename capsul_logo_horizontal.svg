<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
      .brand-text {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 88px;
        letter-spacing: -2.5px;
        fill: #242526;
      }
      .brand-dot {
        fill: #5F7A61;
      }
    </style>
  </defs>
  <!-- Mascot Emblem on Left -->
  <image href="capsul_mascot.png" x="24" y="16" width="168" height="168" preserveAspectRatio="xMidYMid meet" />
  <!-- Wordmark on Right -->
  <text x="216" y="132" class="brand-text">capsul<tspan class="brand-dot">.</tspan></text>
