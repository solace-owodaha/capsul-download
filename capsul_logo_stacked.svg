<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
      .brand-text-stacked {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 78px;
        letter-spacing: -2.2px;
        fill: #242526;
        text-anchor: middle;
      }
      .brand-dot {
        fill: #5F7A61;
      }
    </style>
  </defs>
  <!-- Mascot Emblem Centered Above -->
  <image href="capsul_mascot.png" x="75" y="32" width="250" height="250" preserveAspectRatio="xMidYMid meet" />
  <!-- Wordmark Centered Below -->
  <text x="200" y="380" class="brand-text-stacked">capsul<tspan class="brand-dot">.</tspan></text>
</svg>
